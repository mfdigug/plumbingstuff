# Drives combinatorial SKU generation in scripts/generate_mock_catalog.py.
# `weight` sets each category's relative share of the ~500 total SKUs.
# Each subcategory's `attribute_options` are sampled (not fully cross-producted)
# to build each SKU's `attributes` block and fill its `name_template`.

categories:
  - key: pipes_fittings
    name: "Pipes & Fittings"
    weight: 130
    price_range: [3, 85]
    subcategories:
      - key: copper_elbow
        name: "Copper Elbow"
        name_template: "{brand} Copper Elbow {size}"
        attribute_options:
          size: ["15mm", "20mm", "25mm", "32mm"]
          connection_type: ["Compression", "Solder"]
          material: ["Copper"]
      - key: copper_coupling
        name: "Copper Coupling"
        name_template: "{brand} Copper Coupling {size}"
        attribute_options:
          size: ["15mm", "20mm", "25mm", "32mm", "40mm"]
          connection_type: ["Compression", "Solder"]
          material: ["Copper"]
      - key: pvc_ptrap
        name: "PVC P-Trap"
        name_template: "{brand} PVC P-Trap {size}"
        attribute_options:
          size: ["40mm", "50mm"]
          connection_type: ["Push-Fit"]
          material: ["PVC"]
      - key: pvc_strap
        name: "PVC S-Trap"
        name_template: "{brand} PVC S-Trap {size}"
        attribute_options:
          size: ["40mm", "50mm"]
          connection_type: ["Push-Fit"]
          material: ["PVC"]
      - key: pex_fitting
        name: "PEX Push-Fit Fitting"
        name_template: "{brand} PEX Push-Fit {fitting_shape} {size}"
        attribute_options:
          size: ["16mm", "20mm", "25mm"]
          fitting_shape: ["Elbow", "Tee", "Coupling"]
          connection_type: ["Push-Fit"]
          material: ["PEX"]

