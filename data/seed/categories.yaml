# Drives combinatorial SKU generation in scripts/generate_mock_catalog.py.
# `weight` sets each category's relative share of the ~500 combinatorial SKUs
# (data/seed/explicit_products.yaml adds a further ~45 real, hand-authored anchor
# products on top of this — see that file's header).
# Each subcategory's `attribute_options` are sampled (not fully cross-producted)
# to build each SKU's `attributes` block and fill its `name_template`. Where a
# subcategory covers several real fitting shapes (PEX/compression/press/PE
# fittings, DWV bends) a `fitting_shape`/`angle` attribute is sampled instead of
# splitting into one subcategory per shape, matching the real trade's own
# family naming (see the piping-systems mnemonic sheet this was built from).

categories:
  - key: pipes_fittings
    name: "Pipes & Fittings"
    weight: 220
    price_range: [3, 85]
    subcategories:
      - key: pex_pipe
        name: "PEX Pipe"
        name_template: "{brand} Pipe PEX 100 {color} {size} x {length}"
        attribute_options:
          size: ["16mm", "20mm", "25mm"]
          length: ["5mtr", "25mtr", "50mtr"]
          color: ["Black", "Blue", "Yellow", "Red", "Green"]
          material: ["PEX"]
      - key: pex_fitting
        name: "PEX Push-Fit Fitting"
        name_template: "{brand} LF {fitting_shape} {size}"
        attribute_options:
          size: ["16mm", "20mm", "25mm"]
          fitting_shape: ["Elbow", "Tee", "Coupling", "Adaptor"]
          connection_type: ["Push-Fit"]
          material: ["PEX"]
      - key: pex_lugged_elbow
        name: "PEX Lugged Elbow"
        name_template: "{brand} LF {mount} Lug Elbow {size} ({ext_length} Ext)"
