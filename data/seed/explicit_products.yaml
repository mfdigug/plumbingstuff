# A handful of entries (marked below) use an invented-but-realistic code in the
# same numbering style as the real ones, for terminology called out in the shop-talk
# notes that wasn't itself on an invoice (all-thread/"wolfrate", "speed deck" roof
# clips, G-type PE electrofusion fittings).
#
# Consumed by scripts/generate_mock_catalog.py, which fills in description/price_aud
# and applies the normal by_subcategory + brand_aliases slang from slang_terms.yaml
# on top of any `extra_search_terms` given here.
