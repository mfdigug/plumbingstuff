[project]
name = "plumbing-mock-backend"
version = "0.1.0"
description = "Mock backend for a large AU plumbing ecommerce org: REST API -> internal MCP server -> Elasticsearch"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=9.0.0,<10",
    "sentence-transformers>=3.0,<4",
    "mcp[cli]>=1.9,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "numpy>=1.26,<2",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "faker>=25.0",
]

[project.scripts]
plumbing-mcp-server = "mcp_backend.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_backend*", "rest_api*", "common*"]
