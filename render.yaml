# Render Blueprint for the mock plumbing ecommerce backend.
#
# Architecture (matches the local docker-compose setup):
#   rest-api (public Web Service)
#     -> mcp-server (private Service, internal only)
#         -> elasticsearch (private Service, internal only)
#   rest-api also talks to elasticsearch directly for customers/cart (bypasses MCP).
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# Cross-service addressing uses `fromService`/`property: hostport`, which Render
# resolves to that service's actual internal hostname:port (Render appends an
# auto-generated suffix to service names internally, e.g. `elasticsearch-2j3e`,
# so this must not be hardcoded).
#
# IMPORTANT: a `PORT` env var alone was NOT enough to make `hostport` report the
# right port for the Dockerfile-built (`runtime: docker`) private service here --
# mcp-server's `PORT=8100` env var made the app itself listen on 8100 (confirmed
# in its logs), but `fromService`/`hostport` still reported Render's apparent
# default of 10000 for docker-runtime services, breaking rest-api's connection to
# it. The `port:` field on each service below (separate from the `PORT` env var)
# is what actually drives `hostport` -- set both, they must match.
#
# After first deploy, seed the mock data once via the mcp-server service's Shell
# tab in the Render dashboard:
#   curl -X POST "http://$ES_HOSTPORT/_license/start_trial?acknowledge=true"
#   python scripts/run_pipeline.py
# (The license call unlocks Elasticsearch's RRF retriever used by search.)

services:
  - type: pserv
    name: elasticsearch
    runtime: image
    image:
      url: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    plan: standard
    region: oregon
    port: 9200
    envVars:
      - key: PORT
        value: "9200"
      - key: discovery.type
        value: single-node
      - key: xpack.security.enabled
        value: "false"
      - key: xpack.security.http.ssl.enabled
        value: "false"
      - key: ES_JAVA_OPTS
        value: "-Xms1g -Xmx1g"
    disk:
      name: es-data
      mountPath: /usr/share/elasticsearch/data
      sizeGB: 2

  - type: pserv
    name: mcp-server
    runtime: docker
    dockerfilePath: ./Dockerfile.mcp
    plan: standard
    region: oregon
    port: 8100
    envVars:
      - key: PORT
        value: "8100"
      - key: ES_HOSTPORT
        fromService:
          name: elasticsearch
          type: pserv
          property: hostport
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_SERVER_HOST
        value: "0.0.0.0"
      - key: MCP_SERVER_PORT
        value: "8100"

  - type: web
    name: rest-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: starter
    region: oregon
    port: 8080
    envVars:
      - key: PORT
        value: "8080"
      - key: ES_HOSTPORT
        fromService:
          name: elasticsearch
          type: pserv
          property: hostport
      - key: MCP_SERVER_HOSTPORT
        fromService:
          name: mcp-server
          type: pserv
          property: hostport
